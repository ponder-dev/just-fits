name: Build and release

# Two ways in, and they are not the same thing.
#
#   Actions tab, "Run workflow"   builds and tests everything, publishes nothing.
#   push a v* tag                 the same, and then drafts a release.
#
# Iterate on a branch with the button until it is green. A tag is for
# releasing, never for debugging: a tag push rebuilds the assets, and replacing
# an asset resets its download counter to zero with no way to put it back. Just
# JPEG lost its figures exactly that way.
#   publishing the drafted release   publishes the command line to npm, as
#                                     @ponderdev/justfits, through npm trusted
#                                     publishing: no token is stored anywhere.
#
# So each public step is its own act: the tag, then publishing the draft.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# One run at a time per ref. Two builds racing to draft the same release is a
# way to end up with half the assets attached to it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # ffmpeg first, and once. It runs on Linux because the fetch script wants
  # curl, unzip and tar, and only the Linux runner is certain to have all
  # three. Each build job then takes only its own platform's binaries.
  #
  # Just Cut's fetcher also refuses any build configured --enable-nonfree or
  # without libx264; this one does not yet. Worth bringing across (TODO.md).
  # ---------------------------------------------------------------------
  ffmpeg:
    name: Fetch ffmpeg
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every build a release needs
        run: npm run fetch-ffmpeg -- --all

      # Split by platform so a mac runner does not pull 300MB of Windows exe.
      # The mac build is universal, so it needs both darwin arches.
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mac
          path: vendor/ffmpeg/*-darwin-*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: vendor/ffmpeg/*-linux-*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: vendor/ffmpeg/*-win32-*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------
  # Three platforms, tested and then packaged. Three platforms plus a CLI at
  # launch is the rule, and this is the only place all three are exercised.
  # ---------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: ffmpeg
    if: github.event_name != 'release'
    strategy:
      # One platform failing should not hide what the other two would have
      # said. Finding out about mac and Windows in the same run is the point.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            build: npm run dist:mac
            window: npm run test:window
            # dist:mac already runs `npm run icon`; mac is the only platform with
            # iconutil, so the icns is built here or not at all.
            icon: npm run icon
          - os: ubuntu-latest
            name: linux
            build: npm run dist:linux
            # A runner has no display and no setuid sandbox helper, so Electron
            # dies at startup without both of these. The switch goes before the
            # script, which is where Electron looks for it, and the test knows
            # to ignore anything starting with a dash when it reads its own
            # arguments.
            window: xvfb-run --auto-servernum npx electron --no-sandbox test/window.test.cjs
            # Same two reasons as the window test: no display, no setuid sandbox.
            # Linux packs build/icon.png, so it needs the raster and not the icns.
            icon: npm run icon:svg && xvfb-run --auto-servernum npx electron --no-sandbox scripts/icons.cjs
          - os: windows-latest
            name: windows
            build: npm run dist:win
            # The npm scripts start Electron through scripts/electron.cjs,
            # which works on Windows too.
            window: npm run test:window
            # Windows packs build/icon.png, so it needs the raster and not the icns.
            icon: npm run icon:svg && npm run icon:raster

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Electron 43 dropped its postinstall: its published package.json has no
      # scripts field at all. So npm ci finishes in seconds, reports success,
      # and downloads none of the 295MB binary. Without this the checkout tests
      # green and cannot open a window, which is the most confusing failure
      # this project has.
      - name: Fetch the Electron binary, which npm ci does not
        run: npx install-electron

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.name }}
          path: vendor/ffmpeg

      # An artifact does not carry the executable bit, and a downloaded ffmpeg
      # that cannot be run looks exactly like a missing one.
      - name: Make ffmpeg executable again
        if: runner.os != 'Windows'
        run: chmod +x vendor/ffmpeg/*

      - name: Decisions and the command-line contract
        run: npm test

      - name: The command line, end to end
        run: npm run test:cli

      - name: The window, offscreen
        run: ${{ matrix.window }}

      # The icon is generated from build/icon.svg on every platform, because the
      # svg is now the only icon artifact in git. Nothing downstream is hand
      # edited and nothing is committed that a build can produce. A failure here
      # stops the run rather than packaging with electron-builder's default icon,
      # which is the silent version of this failure and the one that ships.
      # Every iconset size is rendered from the vector by scripts/icons.cjs;
      # ImageMagick is no longer needed.
      - name: Build the icon from its vector
        run: ${{ matrix.icon }}

      - name: Build installers
        run: ${{ matrix.build }}

      # The bug this exists for is live in a sibling tool: one target sets
      # artifactName and another falls through to electron-builder's default,
      # which carries ${version}. A versioned filename breaks every download
      # link on the website the moment a new release goes out, and it does it
      # quietly, on one file out of five.
      - name: Refuse a filename carrying the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version is $version"
          ls -la dist
          bad=$(ls dist | grep -F "$version" || true)
          if [ -n "$bad" ]; then
            echo "::error::These artifacts carry the version in the filename, which breaks the download links: $bad"
            exit 1
          fi
          echo "no artifact carries the version"

      # What the command line says about itself, for the catalogue and the
      # site's specs page. Written once, from Linux, by the tool itself.
      - name: The describe file
        if: matrix.name == 'linux'
        run: node src/cli.cjs --describe > dist/justfits.json

      - uses: actions/upload-artifact@v4
        with:
          name: justfits-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/justfits.json
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Only a tag gets this far, and even then it drafts rather than publishes.
  # ---------------------------------------------------------------------
  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: justfits-*
          path: artifacts

      # Publishing replaces assets of the same name, and GitHub keeps the
      # download counter on the asset, so replacing one resets its count with
      # no way to restore it. Refuse rather than quietly do it again.
      - name: Refuse to republish over an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::$tag already has $count assets. Rebuilding would replace them and reset the download counts. Delete the release first if that is genuinely what you want."
            exit 1
          fi
          echo "$tag has no assets yet, safe to publish."

      - name: Publish the installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            Download the one for your computer below.

            **Mac** JustFits-mac.dmg, one download for both chips.
            **Windows** JustFits-windows-setup.exe, or the portable build if you
            would rather not install anything.
            **Linux** JustFits-linux-x86_64.AppImage, or the tar.gz.
            **Command line** `npm install -g @ponderdev/justfits`

            The .zip files are for Just Tool Belt, which installs from them.

            These builds are not code signed, so the first launch needs one
            extra step. On a Mac, right click the app and choose Open. On
            Windows, click "More info" then "Run anyway".

            Your original is only ever read, nothing is written over, and
            nothing is uploaded.

  # ---------------------------------------------------------------------
  # npm, only when a person publishes the drafted release. Trusted
  # publishing: GitHub proves to npm which workflow built the package, so no
  # token exists to leak, and npm shows where it came from. npmjs.com has to
  # name this repo and this file (release.yml) as the package's trusted
  # publisher first.
  # ---------------------------------------------------------------------
  npm:
    name: Publish the command line to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than Node 22 ships with.
      - name: A current npm
        run: npm install -g npm@latest

      # The repo's package is the desktop app's; npm gets the command line
      # under the PonderDev scope, with nothing it does not need. Its one
      # postinstall stays: it links the tool's Claude skill on a global install
      # (scripts/link-skill.cjs). No skill, no release.
      - name: Shape the package for npm
        run: |
          npm pkg set name=@ponderdev/justfits
          npm pkg delete private devDependencies
          # Read with node, not npm pkg get: npm 12 prints that without quotes.
          test "$(node -p "require('./package.json').scripts.postinstall")" = 'node scripts/link-skill.cjs'
          node src/cli.cjs --version
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'agents/skills/justfits/SKILL.md' pack.txt
          grep -q 'scripts/link-skill.cjs' pack.txt

      # Trusted publishing (OIDC, id-token: write above): no token anywhere. A
      # token in the environment would win over OIDC and fail, so there is none.
      # Provenance comes with it.
      - name: Publish
        run: npm publish --access public

