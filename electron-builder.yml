appId: com.ponderdev.justfits
productName: Just Fits
copyright: Copyright © PonderDev

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  # The skill ships in the app too, for the start screen's Copy skill.
  - agents/skills/**/*
  # The GPL wants its terms traveling with the binary, not just sitting in
  # the repo for whoever thinks to look.
  - LICENSE
  - THIRD-PARTY-NOTICES.md

# ffmpeg and ffprobe ride along beside the app rather than inside the asar,
# because they have to be spawned as real executables. Filtered per platform
# below, or a mac build would carry 290MB of Windows exe it can never run.

asar: true

afterPack: scripts/linux-after-pack.cjs

# No update feed. This is meant to be downloaded once and left alone, so it
# must never phone home looking for a newer version.
publish: null

mac:
  category: public.app-category.video
  icon: build/icon.icns
  # One download that works on both chips, same promise Just JPEG makes. It
  # costs a second Electron and both sets of mac ffmpeg binaries, which is the
  # price of not asking people what is inside their computer.
  target:
    - target: dmg
      arch: [universal]
    # Just Tool Belt installs from the zip: a disk image cannot be mounted
    # reliably from a background process.
    - target: zip
      arch: [universal]
  artifactName: JustFits-mac.${ext}
  extraResources:
    - from: vendor/ffmpeg
      to: ffmpeg
      filter: ["*-darwin-*"]
  # The universal merger walks both sub-builds and refuses to guess what to do
  # with a Mach-O binary that appears in both. Ours are already named by arch
  # and both sub-builds carry the identical set, so tell it to take one copy
  # through untouched rather than trying to lipo them into each other.
  x64ArchFiles: "Contents/Resources/ffmpeg/*"
  # Unsigned: a Developer ID costs more per year than a free app will make.
  # Users get past Gatekeeper with right-click then Open.
  identity: null
  notarize: false
  darkModeSupport: true

dmg:
  # No version in the filename, so download links keep working across releases.
  title: Just Fits
  artifactName: JustFits-mac.${ext}

linux:
  # Set here too, or the tar.gz falls through to electron-builder's default
  # name, which carries the version and breaks the download link (1.1.0's had
  # to be renamed by hand).
  artifactName: JustFits-linux-x86_64.${ext}
  icon: build/icon.png
  # The binary is justfits-app so that ./justfits can be the launcher the
  # tar.gz needs (scripts/linux-after-pack.cjs). The AppImage runs the binary
  # directly.
  executableName: justfits-app
  # Names the AppImage's own .desktop file after desktopName in package.json
  # (com.ponderdev.justfits.desktop), the name its icon goes by too.
  syncDesktopName: true
  # The window's app id on Linux is the tool's own name (the kit's window.cjs),
  # so a dock with no menu entry still says "Just Fits". A menu entry finds the
  # window by this.
  desktop:
    entry:
      StartupWMClass: Just Fits
  category: AudioVideo
  synopsis: Make a file small enough to send
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  extraResources:
    - from: vendor/ffmpeg
      to: ffmpeg
      filter: ["*-linux-*"]

# The AppImage's static runtime (decided 2026-11-20): the older runtime needs
# libfuse2, which a fresh Ubuntu 24.04 does not have, so the AppImage would not
# open there. Its launcher also starts the app without Chromium's sandbox only
# where the system forbids the user namespaces the sandbox needs (24.04's
# AppArmor rule), instead of failing to start.
toolsets:
  appimage: "1.0.3"

appImage:
  artifactName: JustFits-linux-x86_64.${ext}

win:
  # The art filling the square, every size from the vector (scripts/icons.cjs).
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # Just Tool Belt installs from the zip: the portable exe unpacks itself to
    # a temporary folder on every run, so it cannot be installed.
    - target: zip
      arch: [x64]
  artifactName: JustFits-windows.${ext}
  extraResources:
    - from: vendor/ffmpeg
      to: ffmpeg
      filter: ["*-win32-*"]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: JustFits-windows-setup.${ext}
  shortcutName: Just Fits

portable:
  artifactName: JustFits-windows-portable.${ext}
