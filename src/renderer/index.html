<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
<title>Just Fits</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="titlebar"></div>

<div id="app">
<main class="k-utility">

  <!-- The start screen and the file row come from the kit (Kit.start in app.js).
       What follows it shows only once a file is in. -->
  <div id="start"></div>

  <div id="after" class="after-file">
    <section class="k-section">
      <div class="k-field">
        <label for="target">Where is it going</label>
        <select id="target"></select>
        <p class="hint" id="why"></p>
      </div>
      <div class="k-field">
        <label for="custom">Or aim for a size yourself</label>
        <div class="row">
          <input type="number" id="custom" class="k-input k-number" min="1" max="20000" step="1" placeholder="25">
          <span class="k-unit">MB</span>
        </div>
      </div>
      <!-- Only with a folder in: its results go into a new folder beside it
           unless this is ticked (kept through Kit.store). -->
      <div class="k-field" id="where-field" hidden>
        <label class="k-check"><input type="checkbox" id="beside"> Save next to the originals instead</label>
        <p class="hint" id="where-hint"></p>
      </div>
    </section>

    <p class="k-note" id="aim"></p>
    <button type="button" id="go" class="btn btn-primary btn-wide k-action">Compress</button>

    <!-- Working, done and failed, from the kit (Kit.run in app.js). -->
    <div id="run"></div>
  </div>

</main>
</div>

<footer id="footer"></footer>

<script src="kit/kit.js"></script>
<script src="app.js"></script>
</body>
</html>
